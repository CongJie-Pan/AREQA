services:
  # 後端 FastAPI 服務
  - type: web
    name: areqa-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      # 以下為需要你在 Render 後台手動填寫的安全金鑰
      - key: HF_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # 前端 Next.js 服務
  - type: web
    name: areqa-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # 自動從後端服務取得網址，綁定給前端使用
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://areqa-backend.onrender.com
