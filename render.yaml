services:
  # 後端 FastAPI 服務
  - type: web
    name: areqa-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip uv && python -m uv pip install -r requirements-render.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      # 以下為需要你在 Render 後台手動填寫的安全金鑰
      - key: HF_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: MODEL_ZPD_QUERY
        value: google/gemini-3.1-flash-lite
      - key: COMPEER_COOLDOWN_OVERRIDE_SECONDS
        value: "10"
      - key: ENABLE_COMPEER_DEV_CONTROLS
        value: "true"

  # 前端 Next.js 服務
  - type: web
    name: areqa-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # 自動從後端服務取得網址，綁定給前端使用
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://areqa-backend-v9ln.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
