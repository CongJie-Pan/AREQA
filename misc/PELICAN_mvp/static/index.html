<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELICAN Knowledge Tracing MVP</title>
    <link rel="stylesheet" href="styles.css?v=20260721-export">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Settings -->
        <aside class="sidebar">
            <h2>PELICAN MVP</h2>
            <div class="controls">
                <div class="learning-info">
                    <div><strong>Phase:</strong> <span id="phase-display">Onboarding</span></div>
                    <div><strong>Topic:</strong> <span id="topic-display">--</span></div>
                    <div><strong>Plan Source:</strong> <span id="plan-source-display">--</span></div>
                </div>
                <div class="learning-info">
                    <div><strong>EDF State:</strong> <span id="edf-state-display">--</span></div>
                    <div><strong>EDF Policy:</strong> <span id="edf-policy-display">--</span></div>
                    <div><strong>Evidence:</strong> <span id="evidence-count-display">0</span></div>
                    <div><strong>Context:</strong> <span id="context-count-display">0</span></div>
                </div>
                <label for="mode-select">教學模式 (Mode):</label>
                <select id="mode-select">
                    <option value="rule">Rule-based (規則引擎)</option>
                    <option value="llm">LLM-based (生成式AI)</option>
                </select>
                <button id="reset-btn" class="btn">重新開始會話 (Reset)</button>
                <button id="export-btn" class="btn secondary">匯出對話 MD</button>
            </div>
            <div class="tree-container">
                <h3>知識狀態樹</h3>
                <div id="tree" class="tree"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <section class="chat-engine-status" aria-label="系統狀態">
                <div id="current-activity-card" class="activity-card">
                    <div class="activity-card-inner">
                        <span id="activity-status-dot" class="activity-dot idle"></span>
                        <span id="current-activity-label">等待學習主題</span>
                    </div>
                </div>
                <div id="activity-badges" class="activity-badges"></div>
            </section>
            <section class="methodology-panel" aria-label="Agentic PELICAN methodology">
                <div id="methodology-stages" class="methodology-stages"></div>
                <div class="methodology-detail-grid">
                    <div id="skill-artifact-summary" class="methodology-list"></div>
                    <div id="methodology-subsystem-events" class="methodology-list"></div>
                    <div id="agent-executor-trace" class="methodology-list wide"></div>
                    <div id="agent-proposals" class="methodology-list"></div>
                    <div id="tutor-proposal-trace" class="methodology-list"></div>
                    <div id="learner-progress-snapshot" class="methodology-list"></div>
                </div>
            </section>
            <div id="chat-history" class="chat-history"></div>
            
            <div id="loading" class="loading hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <form id="chat-form" class="chat-input-area">
                <input type="text" id="chat-input" placeholder="請輸入您的答案..." autocomplete="off" />
                <button type="submit" class="send-btn">送出</button>
            </form>
        </main>
    </div>
    <script src="app.js?v=20260721-export"></script>
</body>
</html>
