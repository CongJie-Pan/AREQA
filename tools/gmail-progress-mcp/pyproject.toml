[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-progress-mcp"
version = "0.1.0"
description = "Minimal fixed-recipient Gmail MCP server for Codex progress reports"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "google-api-python-client>=2.170,<3",
    "google-auth-oauthlib>=1.2,<2",
]

