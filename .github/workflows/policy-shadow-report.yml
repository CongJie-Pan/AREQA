name: Policy Shadow Report

# Posts the EDF policy shadow experiment report (Gemini serves, Jev runs beside it)
# to one tracking issue: weekly while it runs, then a final report with next steps
# the morning after the experiment ends. Keep SHADOW_UNTIL equal to Render's
# POLICY_SHADOW_UNTIL. Requires the REDIS_URL repository secret.

on:
  schedule:
    # Mondays 09:00 Asia/Taipei (01:00 UTC), while the experiment runs.
    - cron: '0 1 * * 1'
    # Final report 09:00 Asia/Taipei the day after SHADOW_UNTIL.
    - cron: '0 1 13 12 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SHADOW_UNTIL: '2026-12-12'
  ISSUE_TITLE: 'EDF policy shadow experiment: Jev vs Gemini'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether this run reports
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Taipei date +%F)
          final_day=$(date -d "$SHADOW_UNTIL + 1 day" +%F)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=yes
          elif [ "$SCHEDULE_CRON" = "0 1 13 12 *" ]; then
            # Cron has no year field; only the planned final day reports.
            [ "$today" = "$final_day" ] && run=yes || run=no
          else
            [[ ! "$today" > "$SHADOW_UNTIL" ]] && run=yes || run=no
          fi
          echo "Taipei date $today, experiment ends $SHADOW_UNTIL: run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: '3.11'

      - name: Build report
        if: steps.gate.outputs.run == 'yes'
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          POLICY_SHADOW_UNTIL: ${{ env.SHADOW_UNTIL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REDIS_URL" ]; then
            echo "::error::Add the REDIS_URL repository secret to read shadow records."
            exit 1
          fi
          pip install --quiet 'redis>=5.0.0'
          cd backend
          python -m scripts.shadow_policy_report > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post to the tracking issue
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            body="Weekly reports for the EDF policy shadow experiment (POLICY_CLASSIFIER_BACKEND=shadow, ends $SHADOW_UNTIL). Generated by .github/workflows/policy-shadow-report.yml."
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body")
            number="${url##*/}"
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
