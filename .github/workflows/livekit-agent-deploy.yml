name: Deploy LiveKit Agent

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'livekit_agent/**'
      - 'scripts/livekit-agent.sh'
      - '.github/workflows/livekit-agent-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: livekit-agent-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy LiveKit Cloud agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},ANAM_API_KEY=${{ secrets.ANAM_API_KEY }},ANAM_AVATAR_ID=${{ secrets.ANAM_AVATAR_ID }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit_agent
          REGION: ap-south

      - name: Wait for LiveKit Cloud agent status
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit_agent
          TIMEOUT: 5m
