name: Render Service Schedule

on:
  schedule:
    # Resume at Asia/Taipei 09:00 on 2026-11-04 through 2026-11-13.
    - cron: '0 1 4-13 11 *'
    # Keep the existing daily suspension: Asia/Taipei 00:00 = UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Render service action'
        required: true
        default: 'resume'
        type: choice
        options:
          - resume
          - suspend

jobs:
  schedule-render-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve action
        id: action
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            action="$MANUAL_ACTION"
          elif [ "$SCHEDULE_CRON" = "0 1 4-13 11 *" ]; then
            # Cron has no year field; limit automatic resume to this date window.
            taipei_date=$(TZ=Asia/Taipei date +%F)
            taipei_hour=$(TZ=Asia/Taipei date +%H)
            if [[ "$taipei_date" < "2026-11-04" || "$taipei_date" > "2026-11-13" || "$taipei_hour" < "09" ]]; then
              echo "Skipping automatic resume outside the requested window."
              echo "value=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            action=resume
          elif [ "$SCHEDULE_CRON" = "0 16 * * *" ]; then
            action=suspend
          else
            echo "::error::Unexpected scheduled event."
            exit 1
          fi

          case "$action" in
            resume|suspend) ;;
            *) echo "::error::Unsupported Render action."; exit 1 ;;
          esac
          echo "value=$action" >> "$GITHUB_OUTPUT"

      - name: Apply action to backend and frontend
        if: steps.action.outputs.value != 'skip'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          RENDER_ACTION: ${{ steps.action.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          for service_id in "$RENDER_BACKEND_SERVICE_ID" "$RENDER_FRONTEND_SERVICE_ID"; do
            echo "Calling Render ${RENDER_ACTION} for ${service_id}"
            curl --fail-with-body --show-error --silent \
              --request POST \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/${service_id}/${RENDER_ACTION}"
          done
